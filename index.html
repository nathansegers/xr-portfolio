<html lang="en">
<head>

<title>XR Archipelago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#0b0718;
  --ink:#f4efff;
  --muted:#bdb6d9;
  --cyan:#3ee6f5;
  --violet:#8b6cff;
  --violet-deep:#34227f;
  --ember:#ff8a5b;
  --glass:rgba(20,13,40,.58);
  --edge:rgba(230,220,255,.16);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font:15px/1.55 var(--body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.ui{position:fixed;inset:0;pointer-events:none;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
.ui > *{pointer-events:auto}
.brand{position:absolute;left:24px;top:calc(22px + env(safe-area-inset-top,0px));font:800 19px/1 var(--display);letter-spacing:-.01em}
.brand span{color:var(--cyan)}
.brand small{display:block;margin-top:6px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.vr{position:relative;--lift:0px;
  font:600 14px/1 var(--body);color:#fff;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;
  background:linear-gradient(100deg,var(--violet),var(--cyan));
  transform:translateY(calc(var(--lift)*-1));transition:transform .16s,box-shadow .16s,filter .16s;
  box-shadow:0 calc(5px + var(--lift)) 0 var(--violet-deep),0 calc(8px + var(--lift)*3) 22px rgba(0,0,0,.45)}
.vr:hover:not(:disabled){--lift:3px;filter:brightness(1.1)}
.vr:active:not(:disabled){--lift:-4px}
.xr-btns{position:absolute;right:24px;top:calc(18px + env(safe-area-inset-top,0px));display:flex;gap:10px}
.vr.ghost{background:rgba(20,13,40,.7);border:1px solid var(--edge);box-shadow:0 calc(5px + var(--lift)) 0 #1b1535,0 8px 22px rgba(0,0,0,.45)}
.vr:disabled{cursor:default;background:rgba(255,255,255,.08);color:var(--muted);box-shadow:0 5px 0 #1b1535;border:1px solid var(--edge);font-weight:500}
.vr-note{position:absolute;right:24px;top:calc(70px + env(safe-area-inset-top,0px));max-width:250px;text-align:right;font:500 11px/1.45 var(--mono);color:var(--muted)}

.card{position:absolute;left:24px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 48px));
  padding:22px 24px 20px;border-radius:20px;background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 30px 60px -30px rgba(0,0,0,.8);
  transition:opacity .22s,transform .22s}
.card.swap{opacity:0;transform:translateY(8px)}
.fold{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.fold:hover{background:rgba(255,255,255,.12)}
.fold svg{transition:transform .2s}
.card.collapsed .fold svg{transform:rotate(180deg)}
.card.collapsed #cardBody{display:none}
.card.collapsed{padding-block:14px}
.card.collapsed h1{font-size:20px;margin:8px 44px 0 0}
#title{margin-right:40px}
.meta{display:flex;gap:12px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.meta #idx{color:var(--muted)}
.card h1{font:800 clamp(26px,3.2vw,36px)/1.02 var(--display);letter-spacing:-.03em;margin:12px 0 10px;text-wrap:balance}
.card p{margin:0 0 14px;color:var(--muted);max-width:52ch}
.mail{display:inline-block;margin-top:6px;font:700 17px/1.3 var(--display);color:var(--ink);user-select:all}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.tag{font:500 11.5px/1 var(--mono);color:#c9f1ff;background:#1d2448;border:1px solid rgba(160,220,255,.2);padding:7px 11px;border-radius:99px;box-shadow:0 3px 0 #0c0f24}
.spec{font:500 11px/1 var(--mono);letter-spacing:.06em;color:var(--ember)}

.dots{position:absolute;right:24px;top:50%;transform:translateY(-50%);display:grid;gap:14px}
.dot{position:relative;width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:transparent;cursor:pointer;padding:0;transition:transform .2s,background .2s}
.dot[aria-current="true"]{background:var(--cyan);border-color:var(--cyan);transform:scale(1.25);box-shadow:0 0 14px var(--cyan)}
.dot span{position:absolute;right:22px;top:50%;transform:translateY(-50%);white-space:nowrap;font:500 11px/1 var(--mono);color:var(--ink);
  background:var(--glass);border:1px solid var(--edge);padding:6px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s}
.dot:hover span,.dot:focus-visible span{opacity:1}
.hint .short{display:none}
.hint{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);white-space:nowrap;
  font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--muted);pointer-events:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--ground);font:500 12px/1 var(--mono);letter-spacing:.1em;color:var(--muted);transition:opacity .6s}
#loader.gone{opacity:0;pointer-events:none}
body.hover-obj #c{cursor:pointer}
#portalHud{position:absolute;right:24px;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;align-items:flex-end;gap:8px}
body.portal-on #portalHud{display:flex}
body.portal-on .dots,body.portal-on .hint{display:none}
body.portal-mouse #portalCam{display:none}
#portalCam{width:128px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--edge);transform:scaleX(-1);background:#000}
#portalStatus{font:500 11px/1.3 var(--mono);color:var(--ink);background:var(--glass);border:1px solid var(--edge);padding:6px 9px;border-radius:8px}
#arUI{position:fixed;inset:0;display:none;pointer-events:none;color:var(--ink);font:15px/1.4 var(--body)}
#arUI.on{display:block;pointer-events:auto;touch-action:none}
.ar-actions{display:flex;gap:8px}
[hidden]{display:none!important}
#arUI button{pointer-events:auto}
.ar-top{position:absolute;left:16px;right:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ar-title{background:var(--glass);border:1px solid var(--edge);border-radius:14px;padding:10px 14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ar-title small{display:block;font:500 10px/1 var(--mono);letter-spacing:.12em;color:var(--cyan);margin-bottom:6px}
.ar-title b{font:800 18px/1.1 var(--display)}
.ar-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,70px);width:max-content;max-width:calc(100% - 32px);text-align:center;font:500 12px/1.4 var(--mono);background:var(--glass);border:1px solid var(--edge);padding:9px 13px;border-radius:10px}
.ar-nav{position:absolute;left:16px;right:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:12px}

@media (max-width:700px){
  .card{left:16px;right:16px;width:auto;bottom:calc(46px + env(safe-area-inset-bottom,0px));padding:16px 18px}
  .card p{font-size:14px}
  .brand small{display:none}
  #portalHud{right:16px;bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  #portalCam{width:96px;height:72px}
  .hint.used{opacity:0;transition:opacity .4s}
  .dots{right:14px;top:34%}
  .xr-btns{right:16px;top:calc(14px + env(safe-area-inset-top,0px))}.vr{padding:10px 12px;font-size:13px}.vr:disabled{display:none}.vr-note{display:none}
  .brand{font-size:16px;top:calc(24px + env(safe-area-inset-top,0px))}
  .hint .long{display:none}.hint .short{display:inline}
  .brand{left:16px}
  .hint{font-size:10px}
}
</style>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

/* ------------------------------------------------------------------ content */
const SCENES = [
  { eyebrow:'Welcome', title:"Hi, I'm Nathan.", text:'I build mixed-reality experiences for Quest and the open web. Scroll to fly past my projects — or open this page in the Quest Browser and step inside.', tags:['Unity','three.js','WebXR'], spec:'5 scenes · WebXR ready', turf:0x6fae6a },
  { eyebrow:'Project · 2026', title:'Spatial Museum Guide', text:'Mixed-reality tour with hand-tracked hotspots and spatial audio that follows the visitor through the gallery.', tags:['Unity','OpenXR','Quest 3'], spec:'90 Hz · passthrough · 48k tris', turf:0xc9b894 },
  { eyebrow:'Project · 2025', title:'Hand-Tracked Lab Trainer', text:'Students practise lab procedures with their own hands — grab, pour and measure, no controllers needed.', tags:['Unity','XR Hands','Education'], spec:'72 Hz · 26 joints · 0 controllers', turf:0x4f9a8f },
  { eyebrow:'Project · 2025', title:'WebXR Campus Tour', text:'A browser-based campus tour that opens straight into VR on a headset. No install, one link.', tags:['three.js','WebXR','GLB'], spec:'60–90 Hz · 3.2 MB total', turf:0x7cb65f },
  { eyebrow:'Contact', title:"Let's build something spatial.", text:'Open for collaborations, workshops and talks on XR interaction design.', email:'nathan.segers@howest.be', tags:['Collaborations','Workshops','Talks'], spec:'Reply within 2 days', turf:0x9b7bd1 },
];
const N = SCENES.length;
const ROCK = 0x5a3f55;
const TOP = 1.1;                       // island surface height in metres (good table height in VR)
const LAYOUT = [ [0,0,0,.25], [7,-1.2,.12,-.3], [14,.4,-.08,.22], [21,-.8,.1,-.25], [28,0,0,.15] ]; // x, z, y, rotY

/* ------------------------------------------------------------------ renderer */
const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true }); }
catch (e) { document.getElementById('loader').textContent = 'WebGL is not available in this browser.'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0b0718, 1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x3a1c46, 0.032);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 400);
const dolly = new THREE.Group();          // VR rig; identity on desktop
dolly.add(camera);
scene.add(dolly);
const world = new THREE.Group();   // everything that belongs to the archipelago (hidden in AR until placed)
scene.add(world);
const skyStuff = [];               // sky + stars, hidden in AR so the real room shows through

/* ------------------------------------------------------------------ helpers */
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, flatShading:true, roughness:.85, ...o });
const glow = (color, i = 1.2, o = {}) => new THREE.MeshStandardMaterial({ color, emissive:color, emissiveIntensity:i, roughness:.4, ...o });
let seed = 7;
let solidsTmp = [];
const S = m => (solidsTmp.push(m), m);   // registers a mesh as a collider for the ball
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const hash = (x, y, z) => { const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453; return s - Math.floor(s); };
function jitter(geo, amt, keepAbove) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const flat = y >= keepAbove;
    p.setXYZ(i, x + (hash(x, y, z) - .5) * amt, flat ? y : y + (hash(z, x, y) - .5) * amt * .7, z + (hash(y, z, x) - .5) * amt);
  }
  geo.computeVertexNormals();
  return geo;
}
function mesh(geo, material, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
const tickers = [];
const hoverables = [];
function hoverable(root, island) {
  root.userData.island = island; root.userData.h = 0; root.userData.y0 = root.position.y;
  root.userData.bob = 0; root.userData.spin = 0; root.userData.s0 = root.scale.clone();
  root.userData.p0 = root.position.clone(); root.userData.r0 = root.rotation.clone();
  hoverables.push(root);
  return root;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

/* ------------------------------------------------------------------ sky, stars, fireflies */
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(200, 32, 16), new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ indigo:{value:new THREE.Color(0x0d0b2e)}, plum:{value:new THREE.Color(0x4a1f52)}, ember:{value:new THREE.Color(0xe0704a)}, deep:{value:new THREE.Color(0x120a1c)} },
    vertexShader:`varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader:`uniform vec3 indigo,plum,ember,deep; varying vec3 vP;
      void main(){ float h = vP.y;
        vec3 c = mix(ember, plum, smoothstep(-.04, .22, h));
        c = mix(c, indigo, smoothstep(.22, .75, h));
        c = mix(c, deep, smoothstep(-.04, -.5, h));
        gl_FragColor = vec4(c, 1.);
        #include <colorspace_fragment>
      }`
  }));
  scene.add(sky); skyStuff.push(sky);
  tickers.push(() => sky.position.copy(camera.getWorldPosition(new THREE.Vector3())));

  const sp = [];
  for (let i = 0; i < 700; i++) {
    const u = rnd() * Math.PI * 2, v = .12 + rnd() * .88;
    const r = 150, y = v * r, rr = Math.sqrt(r * r - y * y);
    sp.push(Math.cos(u) * rr + 14, y, Math.sin(u) * rr);
  }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  const stars = new THREE.Points(sg, new THREE.PointsMaterial({ color:0xfff4e6, size:1.6, sizeAttenuation:false, fog:false, transparent:true, opacity:.75 }));
  scene.add(stars); skyStuff.push(stars);
}
const flyU = { t:{value:0}, pr:{value:renderer.getPixelRatio()} };
{
  const pos = [], sd = [];
  for (let i = 0; i < 320; i++) { pos.push(-5 + rnd() * 38, .2 + rnd() * 4, -5 + rnd() * 8); sd.push(rnd()); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('seed', new THREE.Float32BufferAttribute(sd, 1));
  world.add(new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms:flyU, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`uniform float t, pr; attribute float seed; varying float vA;
      void main(){ vec3 p = position; p.y += sin(t*.6 + seed*6.28)*.3; p.x += cos(t*.4 + seed*12.)*.25; p.z += sin(t*.5 + seed*9.)*.2;
        vec4 mv = modelViewMatrix * vec4(p,1.); gl_PointSize = 26. * pr / -mv.z; gl_Position = projectionMatrix * mv;
        vA = .35 + .65 * (.5 + .5*sin(t*1.7 + seed*40.)); }`,
    fragmentShader:`varying float vA; void main(){ float d = length(gl_PointCoord - .5); gl_FragColor = vec4(1., .72, .42, smoothstep(.5, 0., d) * vA); }`
  })));
}

/* ------------------------------------------------------------------ lights */
scene.add(new THREE.HemisphereLight(0x9aa6ff, 0x5a2f2a, 1.1));
const key = new THREE.DirectionalLight(0xffd7b0, 2.4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left:-2.6, right:2.6, top:2.6, bottom:-2.6, near:.5, far:20 });
key.shadow.bias = -.0008; key.shadow.normalBias = .02;
scene.add(key, key.target);

/* ------------------------------------------------------------------ island base */
function islandBase(g, turfColor) {
  mesh(jitter(new THREE.CylinderGeometry(1.35, .3, 1.4, 11, 4), .22, .69), mat(ROCK), 0, .3, 0, g);
  mesh(jitter(new THREE.CylinderGeometry(1.45, 1.38, .16, 11, 1), .07, .07), mat(turfColor), 0, 1.02, 0, g);
  for (let i = 0; i < 5; i++) {                          // floating debris under the island
    const s = .1 + rnd() * .22, a = rnd() * 6.28, d = .35 + rnd() * .8;
    const r = mesh(new THREE.DodecahedronGeometry(s, 0), mat(ROCK), Math.cos(a) * d, -.45 - rnd() * .9, Math.sin(a) * d, g);
    r.rotation.set(rnd() * 3, rnd() * 3, 0);
    const ph = rnd() * 6, y0 = r.position.y;
    tickers.push(t => { r.position.y = y0 + Math.sin(t * .8 + ph) * .06; });
  }
  const lighter = new THREE.Color(turfColor).offsetHSL(0, .05, .1).getHex();
  for (let i = 0; i < 12; i++) {                         // tufts + pebbles on the rim
    const a = rnd() * 6.28, d = 1.0 + rnd() * .32;
    if (i % 3) mesh(new THREE.ConeGeometry(.035, .16, 4), mat(lighter), Math.cos(a) * d, TOP + .07, Math.sin(a) * d, g);
    else mesh(new THREE.DodecahedronGeometry(.05 + rnd() * .06, 0), mat(0x8a7486), Math.cos(a) * d, TOP + .03, Math.sin(a) * d, g);
  }
}
function campfire(g, x, z) {
  const f = new THREE.Group(); f.position.set(x, TOP, z); g.add(f);
  for (let i = 0; i < 7; i++) { const a = i / 7 * 6.28; mesh(new THREE.DodecahedronGeometry(.045, 0), mat(0x8d8594), Math.cos(a) * .15, .03, Math.sin(a) * .15, f); }
  const l1 = mesh(new THREE.CylinderGeometry(.025, .025, .26, 6), mat(0x6b3f26), 0, .05, 0, f); l1.rotation.z = Math.PI / 2; l1.rotation.y = .6;
  const l2 = l1.clone(); l2.rotation.y = -.6; f.add(l2);
  const flames = [[0xff6a2b, .07, .26], [0xffa23a, .05, .2], [0xffe08a, .03, .13]].map(([c, r, h]) => {
    const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 6), new THREE.MeshBasicMaterial({ color:c, transparent:true, opacity:.92 }));
    m.position.y = .07 + h / 2; f.add(m); return m;
  });
  const light = new THREE.PointLight(0xff8a3c, 3, 3.2, 2); light.position.y = .3; f.add(light);
  tickers.push(t => {
    flames.forEach((m, i) => { m.scale.y = .85 + Math.sin(t * (9 + i * 3) + i) * .12 + Math.sin(t * 23 + i) * .05; m.rotation.y = t * (1 + i); });
    light.intensity = 2.6 + Math.sin(t * 11) * .4 + Math.sin(t * 27) * .25;
